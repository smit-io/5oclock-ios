name: FiveOClock
options:
  bundleIdPrefix: com.hyperse.5oclock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FiveOClockKit:
    path: FiveOClockKit

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  FiveOClock:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FiveOClockKit
      - target: FiveOClockWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyperse.5oclock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows how far away each 5 o'clock city is from you."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/FiveOClock.entitlements

  FiveOClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: FiveOClockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyperse.5oclock.widget
        CODE_SIGN_ENTITLEMENTS: Widget/FiveOClockWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
